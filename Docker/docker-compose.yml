version: "3.8"

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ccp4i2
      POSTGRES_USER: ccp4i2
      POSTGRES_PASSWORD: ccp4i2_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccp4i2"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Django Server
  server:
    build:
      context: ../server
      dockerfile: ../Docker/Dockerfile.server
      platforms:
        - linux/amd64
    platform: linux/amd64
    environment:
      - DEBUG=False
      - DATABASE_URL=postgresql://ccp4i2:ccp4i2_password@db:5432/ccp4i2
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,server,web
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://web:3000
    volumes:
      - static_files:/usr/src/app/staticfiles
      - media_files:/usr/src/app/media
      - /Users/nmemn/Developer/ccp4data:/mnt/ccp4data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      sh -c "
        echo 'Waiting for CCP4 data volume to be available...' &&
        while [ ! -f /mnt/ccp4data/ccp4-9/bin/ccp4.setup-sh ]; do
          echo 'CCP4 setup script not found, waiting 5 seconds...'
          sleep 5
        done &&
        echo 'CCP4 data volume is available, sourcing setup script...' &&
        . /mnt/ccp4data/ccp4-9/bin/ccp4.setup-sh &&
        echo 'CCP4 environment loaded successfully' &&
        echo 'Running Django migrations...' &&
        ccp4-python manage.py migrate &&
        echo 'Collecting static files...' &&
        ccp4-python manage.py collectstatic --noinput &&
        echo 'Starting Django server...' &&
        ccp4-python manage.py runserver 0.0.0.0:8000
      "

  # Management Service - same build, different command
  management:
    build:
      context: ../server
      dockerfile: ../Docker/Dockerfile.server
      platforms:
        - linux/amd64
    platform: linux/amd64
    environment:
      - DEBUG=False
      - DATABASE_URL=postgresql://ccp4i2:ccp4i2_password@db:5432/ccp4i2
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,server,web
      - CORS_ALLOWED_ORIGINS=http://localhost:3003,http://web:3003
    volumes:
      - static_files:/usr/src/app/staticfiles
      - media_files:/usr/src/app/media
      - /Users/nmemn/Developer/ccp4data:/mnt/ccp4data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      sh -c "
        echo 'Waiting for CCP4 data volume to be available...' &&
        while [ ! -f /mnt/ccp4data/ccp4-9/bin/ccp4.setup-sh ]; do
          echo 'CCP4 setup script not found, waiting 5 seconds...'
          sleep 5
        done &&
        echo 'CCP4 data volume is available' &&
        . /mnt/ccp4data/ccp4-9/bin/ccp4.setup-sh &&
        echo 'CCP4 environment loaded for management service' &&
        echo 'Management service started. Connect with: docker-compose exec management bash' &&
        echo 'Available commands:' &&
        echo '  ccp4-python manage.py shell - Django shell with CCP4 environment' &&
        echo '  ccp4-python manage.py migrate - Run migrations' &&
        echo '  ccp4-python manage.py createsuperuser - Create admin user' &&
        echo '  ccp4-python manage.py collectstatic - Collect static files' &&
        echo '  ccp4-python manage.py dbshell - Database shell' &&
        echo '  ccp4-python manage.py test - Run tests' &&
        tail -f /dev/null
      "
    profiles:
      - management

  # Next.js Web Client
  web:
    build:
      context: ../client
      dockerfile: ../Docker/Dockerfile.web
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=http://server:8000
      - NEXT_PUBLIC_IS_ELECTRON=false
      - BUILD_TARGET=web
      - PORT=3003 # Add this environment variable
    ports:
      - "3003:3003"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      sh -c "
        cd /app/renderer &&
        npx next start -p 3003
      "

volumes:
  postgres_data:
  static_files:
  media_files:

networks:
  default:
    driver: bridge
